<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LovelyLeaderboard</title>
    <script src="leaderboard.js"></script>
    <link rel="stylesheet" href="leaderboard.css">
</head>

<body>
    <div class="lovelyIcon"><img class="imageSizing" src="/leaderboard/image.png" alt="">LovelySystems</div>
    <div id="leaderboard">
        <h2>Leaderboard</h2>
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Username</th>
                    <th>Highscore</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="qrcode">
        <div class="scan-text">Play mobile</div>
        <div class="arrow-down"></div>
        <img src="qrcode.png" alt="qrcode" class="qrcodeIMG">
        <button class="returnButton" onclick="window.location.href = '../index.html';">Return to Game</button>
    </div>
    <button class="returnButtonMobile" onclick="window.location.href = '../index.html';">Return to Game</button>

</body>

</html>
