<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LovelyLeap <3</title>
    <script defer type="module" src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas class="canvas"></canvas>
    <div class="overlay" id="overlay">
        <h1 class="startText" id="startText">Tap or Press Space to Start</h1>
        <h1 class="highScoreText" id="highScoreText"></h1>
        <div class="icons">
            <img class="icon" src="./objects/symbols/trophy.png" onclick="window.location.href='./leaderboard/leaderboard.html';"
                alt="user">

            <img class="icon" src="./objects/symbols/user.png"
                onclick="window.location.href='username.html';" alt="user">
        </div>
    </div>
</body>

</html>
