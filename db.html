<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielstatistiken</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Spielstatistiken</h1>

    <h2>Sprungdaten</h2>
    <table id="jump-logs">
        <thead>
            <tr>
                <th>ID</th>
                <th>Highscore</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <h2>Spieldaten</h2>
    <table id="game-logs">
        <thead>
            <tr>
                <th>ID</th>
                <th>Highscore</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        async function fetchJumpLogs() {
            const response = await fetch('http://localhost:8001/api/jump-logs');
            const data = await response.json();
            const tbody = document.querySelector('#jump-logs tbody');
            data.forEach(log => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${log.id}</td>
                    <td>${log.highscore}</td>
                    <td>${log.timestamp}</td>
                `;
                tbody.appendChild(row);
            });
        }

        async function fetchGameLogs() {
            const response = await fetch('http://localhost:8001/api/game-logs');
            const data = await response.json();
            const tbody = document.querySelector('#game-logs tbody');
            data.forEach(log => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${log.id}</td>
                    <td>${log.highscore}</td>
                `;
                tbody.appendChild(row);
            });
        }

        window.onload = function() {
            fetchJumpLogs();
            fetchGameLogs();
        };
    </script>
</body>
</html>
